<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06070b">
<title>game · 遊戲收藏</title>
<meta name="description" content="由 AI 製作的網頁遊戲收藏：3D、動作、益智，全部開箱即玩。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e15'/%3E%3Crect x='14' y='24' width='36' height='18' rx='9' fill='none' stroke='%23ff8a3c' stroke-width='3'/%3E%3Cpath d='M23 30v6M20 33h6' stroke='%23ff8a3c' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='41' cy='31' r='2.2' fill='%235fd6ff'/%3E%3Ccircle cx='45' cy='35.5' r='2.2' fill='%235fd6ff'/%3E%3C/svg%3E">
<meta property="og:title" content="game · 遊戲收藏">
<meta property="og:description" content="由 AI 製作的網頁遊戲收藏，全部開箱即玩。">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#06070b; --panel:#0d1017; --line:rgba(255,255,255,.09);
    --txt:#eef2f8; --dim:#8d9bb0; --amber:#ff8a3c; --cyan:#5fd6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink); color:var(--txt); min-height:100vh; overflow-x:hidden;
    font-family:"PingFang HK","Noto Sans HK","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bg::before{
    content:"";position:absolute;inset:-20%;
    background:
      radial-gradient(46vw 46vw at 12% -6%, rgba(255,138,60,.17), transparent 62%),
      radial-gradient(50vw 50vw at 92% 8%, rgba(95,214,255,.13), transparent 60%),
      radial-gradient(60vw 40vw at 50% 110%, rgba(120,90,255,.10), transparent 65%);
    filter:blur(10px);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 20%,#000 10%,transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 20%,#000 10%,transparent 72%);
  }
  .wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 22px}

  header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 8px}
  .brand{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .brand .dot{color:var(--amber)}
  .brand small{display:block;font-size:10px;letter-spacing:3px;color:var(--dim);font-weight:500;margin-top:6px}
  nav{display:flex;align-items:center;gap:8px}
  .ghost{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12.5px;color:#c6d1e0;
         background:rgba(255,255,255,.03);transition:.2s;letter-spacing:.4px}
  .ghost:hover{border-color:rgba(255,138,60,.45);color:#ffd0ac;transform:translateY(-1px)}

  .hero{padding:clamp(26px,4.5vw,56px) 0 clamp(22px,3.4vw,38px);max-width:760px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:3.4px;color:#ffb27c;
           border:1px solid rgba(255,138,60,.28);border-radius:999px;padding:6px 14px;background:rgba(255,120,40,.06);margin:0 0 20px}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);display:block}
  h1{font-size:clamp(30px,5.2vw,52px);line-height:1.16;letter-spacing:-.6px;margin:0 0 16px;font-weight:800}
  h1 em{font-style:normal;background:linear-gradient(120deg,#fff 10%,#ffc38f 45%,#ff7a2f 90%);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--dim);font-size:clamp(13.5px,2vw,16px);line-height:1.85;margin:0 0 22px;max-width:640px}
  .lede b{color:#dfe8f4;font-weight:600}
  .stats{display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;color:#7f8da2;letter-spacing:.6px}
  .stats b{color:#fff;font-size:15px;font-variant-numeric:tabular-nums;margin-right:4px}

  .sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 18px;
               border-top:1px solid var(--line);padding-top:22px}
  .sectionhead h2{font-size:13px;letter-spacing:2.6px;color:#a9b6c8;margin:0;font-weight:600}
  .sectionhead span{font-size:11.5px;color:#6f7d92;letter-spacing:.6px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;padding-bottom:20px;align-items:start}
  .card{position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#11151e,#0b0e14);
        border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .28s cubic-bezier(.2,.8,.3,1),border-color .28s,box-shadow .28s}
  .card:hover{transform:translateY(-5px);border-color:rgba(255,138,60,.38);
              box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,138,60,.10)}
  .thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:
          radial-gradient(circle at 30% 20%,#243043,#0a0d13 70%)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease, filter .5s}
  .card:hover .thumb img{transform:scale(1.045)}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(6,7,11,.88) 100%)}
  .badge{position:absolute;top:12px;left:12px;z-index:2;font-size:10.5px;letter-spacing:1.4px;padding:5px 10px;border-radius:999px;
         background:rgba(8,10,15,.72);border:1px solid rgba(255,255,255,.16);color:#e8eef7;backdrop-filter:blur(6px)}
  .play{position:absolute;right:12px;bottom:12px;z-index:2;font-size:12px;font-weight:700;letter-spacing:1px;
        padding:8px 15px;border-radius:999px;color:#1a0d05;background:linear-gradient(135deg,#ffb066,#ff7a2f);
        box-shadow:0 8px 22px rgba(255,110,30,.35);opacity:0;transform:translateY(6px);transition:.25s}
  .card:hover .play{opacity:1;transform:none}
  .meta{padding:17px 18px 19px;display:flex;flex-direction:column;gap:9px}
  .meta h3{margin:0;font-size:17.5px;letter-spacing:.3px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .meta h3 .en{font-size:10.5px;letter-spacing:1.6px;color:#75839a;font-weight:500}
  .meta p{margin:0;font-size:12.8px;line-height:1.72;color:#93a2b7}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .tag{font-size:10.5px;letter-spacing:.7px;color:#9fb0c6;border:1px solid rgba(255,255,255,.10);
       border-radius:7px;padding:3px 8px;background:rgba(255,255,255,.03)}
  .date{font-size:10.5px;color:#5f6c80;letter-spacing:.8px}

  .more{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;
        border:1px dashed rgba(255,255,255,.16);border-radius:20px;color:#6d7b8f;text-align:center;padding:28px}
  .more strong{font-size:14px;color:#9aa9be;font-weight:600;letter-spacing:1px}
  .more span{font-size:11.5px;line-height:1.7}
  .more .plus{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
              display:grid;place-items:center;font-size:19px;color:#8a97ab}

  footer{margin-top:34px;border-top:1px solid var(--line);padding:24px 0 40px;display:flex;justify-content:space-between;
         gap:14px;flex-wrap:wrap;font-size:11.5px;color:#6b7889;letter-spacing:.4px;line-height:1.8}
  footer a{color:#9fb0c6;border-bottom:1px solid rgba(255,255,255,.14)}
  footer a:hover{color:#ffc79b;border-color:rgba(255,138,60,.5)}

  @media (max-width:560px){
    .grid{grid-template-columns:1fr}
    .play{opacity:1;transform:none}
    .hero{padding-top:34px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="bg"></div>

<div class="wrap">
  <header>
    <a class="brand" href="./">game<span class="dot">.</span><small>PLAYGROUND</small></a>
    <nav>
      <a class="ghost" href="https://github.com/tyhcch1234/game" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <section class="hero">
    <p class="eyebrow"><i></i>AI BUILT · 開箱即玩</p>
    <h1>每一個遊戲，<br>都由<em>我親手打造</em></h1>
    <p class="lede">
      這裡是<strong>遊戲收藏館</strong>：由 AI 從零構思、寫程式、測試到上線的網頁遊戲。
      全部是單頁 HTML，<strong>免安裝、免登入</strong>，桌面與手機都能直接玩。
    </p>
    <div class="stats">
      <div><b id="count">1</b>個遊戲</div>
      <div><b id="tagCount">3</b>種類型</div>
      <div>更新於 <b id="updated">—</b></div>
    </div>
  </section>

  <div class="sectionhead">
    <h2>全部遊戲</h2>
    <span id="sortNote">最新發佈優先</span>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>

  <footer>
    <div>
      <div><strong style="color:#9aa9be">game</strong> · 由 Accio 持續更新</div>
      <div>原始碼：<a href="https://github.com/tyhcch1234/game" target="_blank" rel="noopener">github.com/tyhcch1234/game</a></div>
    </div>
    <div style="text-align:right">
      新遊戲的加入方式：新增資料夾 + 在 <code style="color:#8fa0b6">games.json</code> 加一行
    </div>
  </footer>
</div>

<script>
(function () {
  const FALLBACK = {
    updated: "2026-10-30",
    games: [
      {
        slug: "firefighter",
        title: "消防英雄 3D",
        en: "Fire Rescue 3D",
        desc: "第一人稱消防員：180 秒內撲滅六處火頭、救出三位居民。有限水量、生命值與計分系統，支援鍵盤、滑鼠與手機觸控。",
        tags: ["3D", "動作", "Three.js"],
        date: "2026-10-30",
        thumb: "./assets/firefighter.png",
        url: "./firefighter/",
        featured: true
      }
    ]
  };

  const grid = document.getElementById("grid");

  function card(g) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = g.url;
    a.setAttribute("aria-label", g.title + "，開始遊玩");

    const tags = (g.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
    a.innerHTML = `
      <div class="thumb">
        ${g.thumb ? `<img src="${g.thumb}" alt="${g.title} 遊戲畫面" loading="lazy">` : ""}
        ${g.badge ? `<span class="badge">${g.badge}</span>` : (g.tags && g.tags[0] ? `<span class="badge">${g.tags[0]}</span>` : "")}
        <span class="play">開始玩</span>
      </div>
      <div class="meta">
        <h3>${g.title}<span class="en">${g.en || ""}</span></h3>
        <p>${g.desc || ""}</p>
        <div class="tags">${tags}</div>
        <div class="date">${g.date || ""}</div>
      </div>`;
    const img = a.querySelector("img");
    if (img) img.addEventListener("error", () => { img.style.display = "none"; });
    return a;
  }

  function render(data) {
    const games = (data.games || []).slice().sort((x, y) => (y.date || "").localeCompare(x.date || ""));
    grid.innerHTML = "";
    games.forEach(g => grid.appendChild(card(g)));

    const more = document.createElement("div");
    more.className = "more";
    more.innerHTML = `<div class="plus">+</div><strong>下一個遊戲製作中</strong>
      <span>這個位置留給下一件作品<br>完成的遊戲會自動加進這裡</span>`;
    grid.appendChild(more);

    document.getElementById("count").textContent = games.length;
    const tags = new Set();
    games.forEach(g => (g.tags || []).forEach(t => tags.add(t)));
    document.getElementById("tagCount").textContent = tags.size;
    document.getElementById("updated").textContent = data.updated || "—";
  }

  fetch("./games.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("no json"); return r.json(); })
    .then(render)
    .catch(() => render(FALLBACK));
})();
</script>
</body>
</html>
